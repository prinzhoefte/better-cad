[package]
name = "bettercad"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
macroquad = { version = "0.4", default-features = false }
glam = { version = "0.27", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
